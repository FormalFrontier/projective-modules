# Copy to .forgejo/workflows/lean-ci.yaml and set the checker digest below.
# The runner image supplies ff-lean-ci and ff-lean-auth; no host volumes are used.
name: Lean CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "7 17 * * *"
  workflow_dispatch:
concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.event_name == 'push' && 'push' || 'daily' }}
  cancel-in-progress: true
jobs:
  lean:
    name: Lean build and audit
    runs-on: lean-ci
    timeout-minutes: 90
    env:
      # Run `ff-lean-ci-v6 tools-sha` in the selected image. Update this pin whenever
      # the checker changes; docs-only reuse requires the same workflow bytes.
      FF_LEAN_CI_TOOLS_SHA256: b495e8ac285bfdcaa8a12e1d1f4e0dc6937cf03060c74d7662bc0ab0bab7caf5
      FF_LEAN_LINT_TOOLS_SHA256: 5e158bd49b7085397aed0f6e451d6a2fe83243c26af35e79c977f41ed76a9bdd
    steps:
      - name: Check out the proposed commit
        id: own_stage_checkout
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact inputs
        id: inputs
        run: ff-lean-ci-v6 inputs --github-output "$GITHUB_OUTPUT"
      - name: Check for proven docs-only reuse
        id: reuse
        env:
          FF_LEAN_CI_API_TOKEN: ${{ github.token }}
        run: ff-lean-ci-v6 reuse --github-output "$GITHUB_OUTPUT"
      - name: Set up scoped dependency reads
        id: own_stage_dependency_auth
        if: steps.reuse.outputs.reused != 'true'
        env:
          LEAN_CI_READ_AUTH: ${{ secrets.LEAN_CI_READ_AUTH }}
        run: ff-lean-auth setup
      - name: Check the pinned toolchain and fetch exact dependencies
        id: own_stage_prepare
        if: steps.reuse.outputs.reused != 'true'
        run: ff-lean-ci-v6 prepare
      - name: Remove dependency credentials
        id: own_stage_auth_cleanup
        if: always()
        run: ff-lean-auth cleanup
      - name: Record own setup metadata before the configured build/audit
        id: own_setup_baseline
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, stat
          # Metadata only, rooted at cwd: never follow input symlinks or open setup contents.
          def snapshot(name):
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  raise OSError("Non-canonical input path")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              fd = os.open(".", flags)
              try:
                  s = os.fstat(fd)
                  parents = [[s.st_dev, s.st_ino]]
                  missing = False
                  for part in parts[:-1]:
                      if not missing:
                          try:
                              child = os.open(part, flags, dir_fd=fd)
                          except FileNotFoundError:
                              missing = True
                          else:
                              os.close(fd)
                              fd = child
                      if missing:
                          parents.append(None)
                      else:
                          s = os.fstat(fd)
                          parents.append([s.st_dev, s.st_ino])
                  leaf = None
                  if not missing:
                      try:
                          s = os.stat(parts[-1], dir_fd=fd, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          if not stat.S_ISREG(s.st_mode):
                              raise OSError("Non-regular input path")
                          leaf = [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns]
                  return {"parents": parents, "leaf": leaf}
              finally:
                  os.close(fd)
          modules = (
              "ProjectiveModules/Topology/ContinuousLinearMap/Prod",
              "ProjectiveModules/Topology/SplittingNaturality",
              "ProjectiveModules/Topology/Splitting",
              "ProjectiveModules/Topology/SplittingPullback",
              "ProjectiveModules/Topology/SplittingPullback/Nat",
              "ProjectiveModules/Topology/Pullback/Map",
              "ProjectiveModules/Topology/SplittingPullback/Naturality",
              "ProjectiveModules/Topology/Pullback",
              "ProjectiveModules/Topology/Pullback/Assoc",
              "ProjectiveModules/Topology/Pullback/Prod",
          )
          states = {}
          for module in modules:
              try:
                  states[module] = {
                      "setup": snapshot(f".lake/build/ir/{module}.setup.json"),
                      "source": snapshot(module + ".lean"),
                  }
              except OSError:
                  states[module] = None
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("setups=" + json.dumps(states, separators=(",", ":")), file=output)
          EOF
      - name: Build and run the configured audit
        id: build
        if: steps.reuse.outputs.reused != 'true'
        run: ff-lean-ci-v6 run
      - name: Produce independent own Lean JSON diagnostics
        id: own_diagnostics
        if: failure() && steps.build.outcome == 'failure' && steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        env:
          OWN_SETUP_BASELINE: ${{ steps.own_setup_baseline.outputs.setups }}
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, pathlib, stat, subprocess
          # Same no-follow snapshot as before the build, including every existing ancestor.
          def snapshot(name):
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  raise OSError("Non-canonical input path")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              fd = os.open(".", flags)
              try:
                  s = os.fstat(fd)
                  parents = [[s.st_dev, s.st_ino]]
                  missing = False
                  for part in parts[:-1]:
                      if not missing:
                          try:
                              child = os.open(part, flags, dir_fd=fd)
                          except FileNotFoundError:
                              missing = True
                          else:
                              os.close(fd)
                              fd = child
                      if missing:
                          parents.append(None)
                      else:
                          s = os.fstat(fd)
                          parents.append([s.st_dev, s.st_ino])
                  leaf = None
                  if not missing:
                      try:
                          s = os.stat(parts[-1], dir_fd=fd, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          if not stat.S_ISREG(s.st_mode):
                              raise OSError("Non-regular input path")
                          leaf = [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns]
                  return {"parents": parents, "leaf": leaf}
              finally:
                  os.close(fd)
          # The opaque configured build/audit step failed; these are diagnostics, not audit evidence.
          # Only a completed child process supplies a three-file diagnostic artifact.
          root = pathlib.Path(".own-lean-diagnostics")
          root.mkdir()  # Fail closed rather than upload any pre-existing diagnostic files.
          try:
              baseline = json.loads(os.environ.get("OWN_SETUP_BASELINE", ""))
          except ValueError:
              baseline = {}
          if not isinstance(baseline, dict):
              baseline = {}
          # Static whitelist, priority order; no discovery or dependency-module execution.
          modules = (
              "ProjectiveModules/Topology/ContinuousLinearMap/Prod",
              "ProjectiveModules/Topology/SplittingNaturality",
              "ProjectiveModules/Topology/Splitting",
              "ProjectiveModules/Topology/SplittingPullback",
              "ProjectiveModules/Topology/SplittingPullback/Nat",
              "ProjectiveModules/Topology/Pullback/Map",
              "ProjectiveModules/Topology/SplittingPullback/Naturality",
              "ProjectiveModules/Topology/Pullback",
              "ProjectiveModules/Topology/Pullback/Assoc",
              "ProjectiveModules/Topology/Pullback/Prod",
          )
          # Optional input observations, not physical-consumption or output-scope evidence.
          # Only the ten fixed own sources above are read; no setup contents are opened.
          def ids_close(fds):
              while fds:
                  try:
                      os.close(fds.pop())
                  except OSError:
                      pass

          def ids_identity(s):
              return (s.st_dev, s.st_ino, stat.S_IFMT(s.st_mode))

          def ids_file_state(s):
              if not stat.S_ISREG(s.st_mode) or s.st_nlink != 1:
                  raise OSError("Unavailable ordinary file")
              return (s.st_dev, s.st_ino, s.st_mode, s.st_nlink, s.st_size,
                      s.st_mtime_ns, s.st_ctime_ns)

          def ids_cwd(cwd_fd):
              if ids_identity(os.stat(".", follow_symlinks=False)) != ids_identity(os.fstat(cwd_fd)):
                  raise OSError("Changed observation cwd")

          def ids_root(state):
              cwd_fd, root_fd = state
              ids_cwd(cwd_fd)
              if ids_identity(os.stat(".own-lean-input-identifiers", dir_fd=cwd_fd,
                                      follow_symlinks=False)) != ids_identity(os.fstat(root_fd)):
                  raise OSError("Changed metadata directory")

          def ids_start():
              fds = []
              try:
                  flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
                  fds.append(os.open(".", flags))
                  os.mkdir(".own-lean-input-identifiers", mode=0o700, dir_fd=fds[0])
                  created = ids_identity(os.stat(".own-lean-input-identifiers", dir_fd=fds[0],
                                                 follow_symlinks=False))
                  fds.append(os.open(".own-lean-input-identifiers", flags, dir_fd=fds[0]))
                  if created != ids_identity(os.fstat(fds[1])):
                      raise OSError("Changed new metadata directory")
                  ids_root(fds)
                  return fds
              except Exception:
                  ids_close(fds)
                  return None

          def ids_sha256(index, cwd_fd):
              import hashlib
              parts = (modules[index] + ".lean").split("/")
              fds = [cwd_fd]
              opened = []
              try:
                  ids_cwd(cwd_fd)
                  for part in parts[:-1]:
                      fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                   dir_fd=fds[-1])
                      opened.append(fd)
                      fds.append(fd)
                  fd = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                               dir_fd=fds[-1])
                  opened.append(fd)
                  before = ids_file_state(os.fstat(fd))
                  digest = hashlib.sha256()
                  size = 0
                  while True:
                      block = os.read(fd, 1048576)
                      if not block:
                          break
                      size += len(block)
                      digest.update(block)
                  if before != ids_file_state(os.fstat(fd)) or size != before[4]:
                      raise OSError("Unstable source")
                  if before != ids_file_state(os.stat(parts[-1], dir_fd=fds[-1],
                                                       follow_symlinks=False)):
                      raise OSError("Changed source identity")
                  for parent, child, part in zip(fds, fds[1:], parts[:-1]):
                      named = ids_identity(os.stat(part, dir_fd=parent, follow_symlinks=False))
                      if named != ids_identity(os.fstat(child)):
                          raise OSError("Changed source ancestry")
                  ids_cwd(cwd_fd)
                  return digest.hexdigest()
              finally:
                  ids_close(opened)

          def ids_observe(index):
              try:
                  if ids_state is not None:
                      return ids_sha256(index, ids_state[0])
              except Exception:
                  pass
              return "UNKNOWN"

          def ids_publish(index, observed_before, observed_after):
              global ids_state
              if ids_state is None:
                  return
              fds = []
              try:
                  ids_root(ids_state)
                  cwd_fd, root_fd = ids_state
                  name = f"module_{index}"
                  os.mkdir(name, mode=0o700, dir_fd=root_fd)
                  directory_identity = ids_identity(os.stat(name, dir_fd=root_fd, follow_symlinks=False))
                  directory = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                      dir_fd=root_fd)
                  fds.append(directory)
                  if directory_identity != ids_identity(os.fstat(directory)):
                      raise OSError("Changed new module directory")
                  data = (json.dumps({"schema": "own-lean-input-identifiers/v1", "index": index,
                                      "module": modules[index], "before_sha256": observed_before,
                                      "after_sha256": observed_after}, separators=(",", ":")) + "\n").encode("utf-8")
                  if len(data) > 4096:
                      raise OSError("Oversize metadata")
                  fd = os.open("inputs.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                               0o600, dir_fd=directory)
                  fds.append(fd)
                  ids_file_state(os.fstat(fd))
                  view = memoryview(data)
                  while view:
                      written = os.write(fd, view)
                      if written <= 0:
                          raise OSError("Incomplete metadata write")
                      view = view[written:]
                  os.fsync(fd)
                  expected = ids_file_state(os.fstat(fd))
                  if expected[4] != len(data):
                      raise OSError("Incomplete metadata size")
                  os.close(fd)
                  fds.pop()
                  if expected != ids_file_state(os.stat("inputs.json", dir_fd=directory,
                                                        follow_symlinks=False)):
                      raise OSError("Changed metadata file")
                  os.fsync(directory)
                  os.fsync(root_fd)
                  ids_root(ids_state)
                  if directory_identity != ids_identity(os.stat(name, dir_fd=root_fd, follow_symlinks=False)):
                      raise OSError("Changed module directory")
                  os.close(directory)
                  fds.pop()
                  ids_root(ids_state)
                  if directory_identity != ids_identity(os.stat(name, dir_fd=root_fd, follow_symlinks=False)):
                      raise OSError("Changed closed module directory")
                  # This flag is independent of every compiler-trio completion flag.
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      print(f"module_{index}_inputs_complete=true", file=output)
              except Exception:
                  ids_close(ids_state)
                  ids_state = None
              finally:
                  ids_close(fds)

          ids_state = ids_start()
          for index, module in enumerate(modules):
              feedback = root / module
              feedback.mkdir(parents=True, exist_ok=True)
              setup = f".lake/build/ir/{module}.setup.json"
              source = module + ".lean"
              reason = None
              try:
                  before = baseline[module]
                  current = snapshot(setup)
                  current_source = snapshot(source)
                  old_setup = before["setup"]
                  # Missing parents may be created, but existing ancestry must retain identity.
                  old_parents = old_setup["parents"]
                  if (len(old_parents) != len(current["parents"]) or any(
                          old is not None and old != new
                          for old, new in zip(old_parents, current["parents"]))):
                      reason = "Existing setup ancestry was replaced or became unavailable."
                  elif current_source["leaf"] is None or before["source"] != current_source:
                      reason = "The exact own source or its ancestry changed or is unavailable."
                  elif current["leaf"] is None:
                      reason = "The configured build did not leave the exact setup file."
                  elif old_setup["leaf"] == current["leaf"]:
                      reason = "The setup was not newly generated or changed by this build."
              except (KeyError, TypeError):
                  reason = "Pre-build input metadata is unavailable."
              except OSError:
                  reason = "An input path is symlinked, non-regular or unavailable."
              if reason is not None:
                  continue
              # Pass the same-run setup filename unchanged; never read its JSON contents here.
              with (feedback / "stdout.jsonl").open("wb") as stdout, (feedback / "stderr.log").open("wb") as stderr:
                  observed_before = ids_observe(index)
                  try:
                      result = subprocess.run(
                          ["lake", "env", "lean", source, "--setup", setup, "--json"],
                          stdout=stdout, stderr=stderr, check=False,
                      )
                  except OSError:
                      # No child return code exists if launch failed.
                      (feedback / "stdout.jsonl").unlink()
                      (feedback / "stderr.log").unlink()
                      continue
                  observed_after = ids_observe(index)
              (feedback / "exit-code.txt").write_text(str(result.returncode) + "\n", encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print(f"module_{index}_complete=true", file=output)
              ids_publish(index, observed_before, observed_after)
          if ids_state is not None:
              ids_close(ids_state)
          EOF
      - name: Lint the configured libraries
        id: own_stage_lint
        if: steps.reuse.outputs.reused != 'true'
        run: ff-lean-lint run
      - name: Show the failed build or audit output
        id: own_stage_failure_display
        if: failure()
        run: |
          python3 -X utf8 - <<'EOF'
          import json, pathlib, re
          # Build and audit commands only; dependency and credential steps stay in the artifact.
          labels = {"official-mathlib-cache", "verify-mathlib-cache", "lake-build", "sorry-gate", "axiom-audit"}
          # Lake starts each reported job with "<icon> [n/m]"; a failed job's icon is ✖ and its messages follow.
          job = re.compile(r"[✔✖⚠ℹ] \[\d+/\d+\]")

          def show(line):
              # The prefix stops output lines being read as workflow commands.
              print("| " + re.sub(r"[\x00-\x08\x0b-\x1f\x7f]", "", line)[:1000])

          for command in sorted(pathlib.Path(".lean-ci-evidence/commands").glob("*-*")):
              receipt = command / "receipt.json"
              if (command.name.split("-", 1)[1] not in labels or not receipt.is_file()
                      or json.loads(receipt.read_text()).get("exit_code") == 0):
                  continue
              for stream in ["stderr", "stdout"]:
                  lines = (command / stream).read_bytes().decode(errors="replace").splitlines()
                  # The failed jobs' messages above the tail, which a large build pushes out of it.
                  failed, inside = [], False
                  for line in lines[:-200]:
                      if job.match(line):
                          inside = line.startswith("✖")
                      if inside:
                          failed.append(line)
                  if failed:
                      print(f"{command.name} {stream}: failed Lake jobs before the last 200 lines, "
                            f"first {min(len(failed), 2000)} of {len(failed)} lines")
                      for line in failed[:2000]:
                          show(line)
                  print(f"{command.name} {stream}: last {min(len(lines), 200)} of {len(lines)} lines")
                  for line in lines[-200:]:
                      show(line)
          EOF
      - name: Preserve commands, inputs, audit output and result
        id: own_stage_evidence_upload
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: lean-ci-evidence
          path: .lean-ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent semilinear product Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_0_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: semilinear-product-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/ContinuousLinearMap/Prod/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/ContinuousLinearMap/Prod/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/ContinuousLinearMap/Prod/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent splitting naturality Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_1_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: splitting-naturality-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingNaturality/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingNaturality/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingNaturality/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent continuous splitting Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_2_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: continuous-splitting-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/Splitting/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/Splitting/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/Splitting/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent splitting pullback Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_3_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: splitting-pullback-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent splitting pullback Nat Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_4_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: splitting-pullback-nat-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Nat/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Nat/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Nat/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent pullback map Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_5_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: pullback-map-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/Pullback/Map/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/Pullback/Map/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/Pullback/Map/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent splitting pullback naturality Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_6_complete == 'true'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: splitting-pullback-naturality-lean-diagnostics
          path: |
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Naturality/stdout.jsonl
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Naturality/stderr.log
            .own-lean-diagnostics/ProjectiveModules/Topology/SplittingPullback/Naturality/exit-code.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent pullback Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.module_7_complete == 'true'
