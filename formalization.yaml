version: "v0.4"

project:
  name: "Projective modules"
  description: >-
    Reusable Lean theory of projective modules: finite-projective dual and
    evaluation base change, invertible modules, exterior algebras and powers,
    determinants, bounded cancellation and countable absorption, infinite free
    coordinates, finite stable presentations and IBN-only integer-rank
    independence, balanced tensor products, right scalar extension and chosen
    right-free coefficient transport along arbitrary unital semiring
    homomorphisms, exactness, local and PID freeness,
    preadditive stable module categories, countably generated submodules over
    left-Noetherian rings, and locally constant rank and componentwise-free
    classification. Noncommutative and commutative results retain their distinct
    hypotheses; rank classification is not asserted for all finite projectives
    over arbitrary rings.
    Over arbitrary rings, the library also describes stably-free kernels of
    surjections onto finitely generated stably-free targets, finite-coordinate
    kernel presentations and surjective right-linear matrix kernels.
    Rectangular right-coordinate maps need finite source coordinates but allow
    arbitrary target indices; transporting a supplied equivalence needs both
    indices finite. These constructions use left coefficients and right
    scalars, without commutativity, injectivity, IBN or equal index cardinalities.
    Finite projective categories over arbitrary rings are essentially small in
    the ring universe at independent carrier universes. Ring-universe
    representatives and linear equivalences give a common reference skeleton
    for comparing arbitrary input classes.
    Over a commutative semiring, an idempotent-generated ideal is free exactly
    for the zero and unit idempotents, without a nontriviality assumption.
    Right scalar-extension comparisons satisfy pointwise unit and
    triple-composition associativity laws over arbitrary rings and right
    modules, with five independent scalar and module universes.
    Principal right ideals over arbitrary source and target rings have an
    image-one scalar-extension equivalence without idempotence, and an
    image-zero annihilation theorem with idempotence. An idempotent right
    ideal and its scalar extension are bundled as finite projectives over
    arbitrary rings, including noncentral matrix idempotents.
    The right-ideal bundle has an identity linear equivalence to its
    canonical principal ideal, identifying zero and scalar action.
    Canonical right regular modules on ordinary semiring carriers are finite
    and free, including zero semirings. A finite projective common stabilizer
    can be replaced by a common standard finite free one, without finiteness
    or projectivity assumptions on the ambient modules. Finite ranks are
    preserved by ring-universe representatives; finitely generated free
    categorical objects are classified by finite rank over rings satisfying
    the strong rank condition, not all finite projectives over arbitrary rings.
    Finite projective right-module classes form a ring-sized direct-sum monoid
    and additive Grothendieck group, with arbitrary-carrier generators,
    universal properties and common finite-projective or finite-free
    stabilization criteria over arbitrary rings. Over division rings, canonical
    natural-valued class and integer-valued group dimensions give additive
    equivalences with ℕ and ℤ, with finite-coordinate and all-integer
    regular-generator inverses. Scalar extension along arbitrary unital maps
    between division rings preserves both dimensions and induces bijective
    class and K₀ maps. For a division-ring source and any ring target, the whole
    induced maps are independent of the chosen scalar homomorphism. Subsingleton
    rings give trivial class monoids and groups, not division-ring dimension invariants.
    Every unital ring homomorphism induces additive scalar-extension maps on
    right-module classes and K₀, with arbitrary-carrier evaluation and entire-map
    identity and composition laws over noncommutative and zero rings.
    The free-word zero-generator augmentation returns the coefficient of the
    empty word, fixing constants and killing letter monomials. The full-letter
    linear combination has range equal to its canonical semilinear kernel,
    under the left regular word-semiring action. These results allow arbitrary,
    possibly noncommutative or trivial coefficient semirings and empty or
    infinite alphabets, with independent coefficient and alphabet universes.
    Over a commutative base ring R and an arbitrary target ring S, right
    scalar extension agrees with the module-first Mathlib tensor product,
    with the specified homomorphism-induced coefficient action and right
    multiplication on coefficients. For commutative S, a separate pointwise
    comparison lands in the right-module view of Mathlib's scalar-first
    extension. Pure-tensor, inverse and map-naturality laws retain independent
    scalar and carrier universes without finiteness or centrality hypotheses.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
