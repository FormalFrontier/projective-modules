    - declaration: "LinearMap.supportedRangeProdComplementEquiv"
      file: "ProjectiveModules/Module/InvariantSupportedProjection.lean"
      note: "Split nested invariant supported ranges of an idempotent; complementary increments are projective."
    - declaration: "LinearMap.supportedRangeComplement_countablyGenerated"
      file: "ProjectiveModules/Module/InvariantSupportedProjection.lean"
      note: "Countable coordinate differences give countably generated complements with the stated invariance and idempotence."
    - declaration: "LinearMap.CountableInvariantCoordinateFiltration.range_free_of_free_increments"
      file: "ProjectiveModules/Module/TransfiniteRangeBasis.lean"
      note: "An idempotent range is free when its filtration increments are free; not an unconditional free-range claim."
    - declaration: "Module.Projective.free_of_isUnit_compl_arbitraryRank"
      file: "ProjectiveModules/Module/ArbitraryLocalProjectiveFree.lean"
