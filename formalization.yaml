    - declaration: "Module.Free.rightIdealProdEndNatFinsuppEquiv"
      file: "ProjectiveModules/Free/CountableAbsorption.lean"
      note: "Corresponding absorption for complemented right ideals of a countable free endomorphism ring."
    - declaration: "RingHom.rankCondition"
      file: "ProjectiveModules/Free/InvariantBasisNumber.lean"
      note: "Rank condition descends along any unital semiring homomorphism from a target with rank condition, with independent source and target universes; the map need not be injective or surjective."
    - declaration: "RingHom.invariantBasisNumber"
      file: "ProjectiveModules/Free/InvariantBasisNumber.lean"
      note: "Invariant basis number descends along any unital semiring homomorphism from a target with invariant basis number; no rank-condition or injectivity premise is needed."
    - declaration: "MonoidAlgebra.linearIndependent_freeMonoid_of"
      file: "ProjectiveModules/Free/FreeWordAlgebra.lean"
      note: >-
        The letter monomials form a linearly independent family over the left
        regular module of A = MonoidAlgebra K (FreeMonoid alphabet), for arbitrary
        Semiring K and independently universed alphabet. Canonical finitely
        supported linear combinations multiply each polynomial coordinate by
        its letter on the right; its terminal-word coefficients recover the
        coordinate. Injective reindexing gives arbitrary independent subfamilies.
        No Nontrivial, commutativity, centrality or finite-alphabet hypothesis.
        Trivial coefficients and the empty family are included without implying
        a nonzero module; repeated letters over nontrivial coefficients need
        not be independent. This is A-linear independence, not merely K-linearity.
    - declaration: "MonoidAlgebra.freeWordPairMap_eq_linearCombination"
      file: "ProjectiveModules/Free/FreeWordAlgebra.lean"
      note: >-
        The two-letter left-A-linear map equals the canonical finitely supported
        linear combination after the inverse finite coordinate equivalence.
        Its distinct-letter injectivity follows by reindexing the general family.
    - declaration: "MonoidAlgebra.freeWordPairMap_injective"
      file: "ProjectiveModules/Free/FreeWordAlgebra.lean"
      note: >-
        Over any Semiring K and any alphabet in an independent universe,
        distinct letters give an injective left-A-linear map from Fin 2 coordinates
        to A = MonoidAlgebra K (FreeMonoid alphabet). Right multiplication
        appends letters, and disjoint final suffixes recover both input
        coefficients. No Nontrivial, commutativity or finite-alphabet
        hypothesis; trivial coefficients give singleton modules.
    - declaration: "MonoidAlgebra.not_strongRankCondition_freeMonoid"
      file: "ProjectiveModules/Free/FreeWordAlgebra.lean"
      note: >-
        For distinct letters over arbitrary semiring coefficients, the
        free-word semiring fails the strong rank condition: transport the pair
        injection to a Fin 1 codomain and contradict the strong-rank bound
        2 ≤ 1. Mathlib's free-algebra contrast is credited there to T. Y. Lam.
        The rational-Boolean private client separately obtains rank condition
        and invariant basis number by augmentation; these positive properties
        are not asserted for every coefficient semiring. This entry asserts
        neither source correspondence nor whole-book coverage.
    - declaration: "MonoidAlgebra.freeMonoidAugmentation"
      file: "ProjectiveModules/Free/FreeWordAugmentation.lean"
      note: >-
        Zero-generator ring homomorphism from the free-word semiring to its
        coefficient semiring. Coefficients may be noncommutative or trivial,
        and coefficient and alphabet universes are independent. Empty
        alphabets are allowed; no module action on the coefficient carrier
        is chosen by this construction.
    - declaration: "MonoidAlgebra.freeMonoidAugmentation_single"
      file: "ProjectiveModules/Free/FreeWordAugmentation.lean"
      note: "A monomial maps to its coefficient multiplied by the value of its word under the zero-generator word map."
    - declaration: "MonoidAlgebra.freeMonoidAugmentation_single_one"
      file: "ProjectiveModules/Free/FreeWordAugmentation.lean"
      note: "Constant monomials map to their coefficients."
    - declaration: "MonoidAlgebra.freeMonoidAugmentation_single_of"
      file: "ProjectiveModules/Free/FreeWordAugmentation.lean"
      note: "Every letter monomial maps to zero, for any coefficient."
    - declaration: "MonoidAlgebra.freeMonoidAugmentation_apply"
      file: "ProjectiveModules/Free/FreeWordAugmentation.lean"
      note: >-
        The zero-generator augmentation returns x.coeff 1, the coefficient of
        the empty word, for every free-word polynomial over any semiring.
        Noncommutative and trivial coefficients and empty or infinite alphabets
        are included, with independent coefficient and alphabet universes.
    - declaration: "MonoidAlgebra.range_linearCombination_freeMonoid_of_eq_ker_freeMonoidAugmentation"
      file: "ProjectiveModules/Free/FreeWordAugmentationKernel.lean"
      note: >-
        The range of Finsupp.linearCombination A of all letter monomials equals
        LinearMap.ker of the zero-generator augmentation's toSemilinearMap,
        with A = MonoidAlgebra K (FreeMonoid alphabet). Coordinates are A-valued
        and letters multiply on the right under the canonical left regular
        A-action. Only Semiring K is required; coefficient and alphabet
        universes are independent, including noncommutative or trivial
        coefficients and empty or infinite alphabets. No global Module A K
        instance, basis or linear equivalence onto the kernel is constructed.
    - declaration: "Module.exists_fin_prod_linearEquiv_iff_finite_isStablyFree"
      file: "ProjectiveModules/Free/StablePresentation.lean"
      note: "Over arbitrary rings, existence of a finite-coordinate stable presentation is equivalent to finite generation and stable freeness, without IBN or a nontriviality assumption."
    - declaration: "Module.card_add_card_eq_of_prod_linearEquiv"
