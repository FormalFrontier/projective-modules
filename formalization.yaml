      note: "Finite rank is preserved by the chosen ring-universe representative, with independent scalar and carrier universes."
    - declaration: "ModuleCat.nonempty_iso_iff_finrank_eq"
      file: "ProjectiveModules/Category/FiniteModuleDimension.lean"
      note: "Finitely generated free objects over a strong-rank-condition ring are isomorphic exactly when finite ranks agree."
    - declaration: "FGModuleCat.nonempty_iso_iff_finrank_eq"
