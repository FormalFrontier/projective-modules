fidelity:
  divergences: >-
    Right modules are modules over opposite rings; balance uses the actual
    right/left actions, and Hom exactness is additive where scalar linearity
    is unavailable. Full exterior-algebra base change is distinguished from
    the separate fixed-degree binary Sum Formula. Rank-one invertibility has
    proposition-level hypotheses; componentwise-free classification does not
    classify arbitrary finite projectives by rank. Countable and arbitrary-rank
    freeness routes retain their projectivity, idempotence, proper-ideal,
    countable-difference or free-increment premises. Local proper-ideal/unit
    assumptions exclude zero rings, unlike several rank constructions. No
    general multivariable Quillen-Suslin, Picard group, K0, arbitrary cancellation,
    fixed-degree scalar-extension naturality or whole-source formalization is
    claimed. Source-specific bridges and milestone decisions remain separate.
    The Module.componentwiseFreeModel_finite and
    Module.componentwiseFreeModel_projective binders now use Finite I instead
    of Fintype I, choosing Fintype.ofFinite locally; finiteness and the latter
    theorem's idempotence premise remain. These are not literally unchanged
    types; compatibility for external explicitly supplied instance arguments
    remains unclaimed for arbitrary external clients; in-tree clients compiled.

