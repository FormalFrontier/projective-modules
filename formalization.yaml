status:
  scope: >-
    Reusable projective-module algebra: finite-projective dual/evaluation and
    exterior-algebra base change, fixed-degree binary Sum Formula,
    invertibility, bounded cancellation, noncommutative right-module
    extension, local and PID freeness, preadditive stable categories, rank
    realization and conditional componentwise-free classification, and
    countably generated submodules over left-Noetherian rings. Over a
    nontrivial semiring, bases with an infinite first index have equal lifted
    index cardinalities; infinite free coordinate modules are linearly
    equivalent exactly when their index types are equivalent. This needs no
    invariant basis number, strong rank condition or commutativity, and index,
    scalar and module types may inhabit independent universes. The chosen
    index equivalence need not preserve basis vectors. Library and regression
    modules are default build roots. Rank condition and invariant basis number
    each pull back along arbitrary unital semiring homomorphisms, provided the
    target has the corresponding property; the IBN pullback does not require
    target rank condition. Over arbitrary rings, finite-coordinate stable
    presentations exist exactly for finitely generated stably-free modules,
    including the zero-ring case. Under IBN alone, two finite-index
    presentations over a semiring give
    equal cross-sums and integer coordinate differences, even when the presented
    module is not separately assumed free or finite; no rank condition or
    natural-number subtraction is used. No source-specific or whole-book
    coverage is asserted.
    Over arbitrary rings, a surjection from a stably-free module onto a finitely
    generated stably-free module has stably-free kernel; the domain need not be
    finitely generated, and this statement does not assert finite generation of
    its kernel.
    Finitely generated stably-free modules are exactly those linearly equivalent
    to kernels of surjections between finite coordinate modules. Surjective
    opposite-scalar matrix maps have finitely generated stably-free right-module
    kernels, with left matrix coefficients. No IBN, rank condition, commutativity
    or nonzero-ring hypothesis is needed, and kernel freeness is not asserted.
    Finite projective modules over R : Type u with carriers in independent
    Type v form an essentially small category in universe u, without an assumed
    Small premise. Every finite projective input has a representative with
    carrier in Type u and a linear equivalence to the input. Classes are compared
    only in the skeleton of the reference category with carrier universe u;
    their equality is equivalent to linear equivalence of the inputs, including
    inputs from different carrier universes. These size interfaces alone do
    not construct a K₀ group. Separate KTheory modules resize the direct-sum
    class monoid and form its additive Grothendieck group, both in Type u.
    They provide descent, evaluation, extensionality and uniqueness laws,
    difference representatives and common stabilization criteria. A common
    finite projective stabilizer may be replaced by Fin n → Rᵐᵒᵖ, with
    existential n and no IBN or projective-module cancellation premise.
    Equality of differences stabilizes the cross-sums P × Q' and P' × Q.
    Inputs may have independent carrier universes. For arbitrary rings, finite
    coordinate classes are natural multiples of the regular class by the
    direct-sum law, not an IBN assertion. Over a division ring D, the canonical
    natural-valued class dimension and its unique integer-valued K₀ extension
    are the whole forward homomorphisms of additive equivalences
    ProjectiveClass D ≃+ ℕ and K0 D ≃+ ℤ. These use the standard AddEquiv
    interface, not ring equivalences. Their inverses send n to the class of
    Fin n → Dᵐᵒᵖ and every integer z, including negatives, to
    z • K0.of D Dᵐᵒᵖ. Both canonical-map round trips and compatibility with
    the natural-to-integer cast on class generators are provided. Evaluation
    and dimension recovery accept finitely generated modules in independent
    carrier universes; freeness and projectivity follow from DivisionRing.
    Equality of finite-module K₀ generators is equivalent to right-linear
    isomorphism only under the division-ring hypothesis, not for arbitrary rings.
    Scalar extension along any unital φ : D →+* S between division rings
    preserves both natural and integer dimensions as equalities of entire
    canonical homomorphisms. Over subsingleton rings, which are not division
    rings, both entire class monoids and groups are subsingletons, without
    treating module finrank as an additive invariant.
    For arbitrary rings and an arbitrary additive commutative right module,
    identity and iterated right scalar extension are linearly equivalent to
    the original module and direct composite extension. Their two unit laws
    and triple-composition associativity are pointwise equalities of linear
    maps or linear equivalences, with all scalar and module universes
    independent. The ordered triple coefficient is θ (ψ s * t) * u,
    equal to θ (ψ s) * (θ t * u) by multiplicativity and associativity,
    not commutativity. These statements do not construct categorical natural
    isomorphisms, triangle or pentagon laws, common-universe carrier lifts, or
    scalar-extension compatibility with such lifts.
    The zero-generator free-word augmentation is a ring homomorphism defined
    by the universal word map sending every letter to zero. It returns the
    coefficient of the empty word. For A = MonoidAlgebra K (FreeMonoid alphabet),
    the canonical A-linear combination of all letter monomials has range equal
    to the kernel of the augmentation's RingHom.toSemilinearMap. Coordinates
    use the left regular A-action and multiply their letters on the right;
    the semilinear map uses the canonical self-actions on A and K, not a global
    Module A K instance. Only Semiring K is required, with independent scalar
    and alphabet universes; noncommutative or trivial coefficients and empty
    or infinite alphabets are included. No basis or linear equivalence onto
    this kernel is constructed.

    For CommRing R, Ring S, a unital φ : R →+* S and M : ModuleCat Rᵐᵒᵖ,
    tensorProductObj uses the source action restricted along
    (RingEquiv.toOpposite R).toRingHom and the coefficient module
    (ModuleCat.restrictScalars φ).obj (ModuleCat.of S S). Its carrier is the
    module-first TensorProduct in Type (max uM uS), independent of uR, and
    op t acts on m tensor s by right multiplication s * t. The coefficient
    left action is φ r * s, including when R = S and φ is not the identity;
    no Algebra R S, centrality, finiteness, projectivity, injectivity or
    nontriviality is required. tensorProductLinearEquiv and its inverse
    preserve the module-first pure tensors and intertwine source morphisms
    with TensorProduct.map and the right-extension functor'. With CommRing S,
    extendScalarsLinearEquiv instead sends m tensor s to s tensor m in the
    right-module view of ModuleCat.extendScalars φ. Its inverse restores
    module-first order, it agrees with TensorProduct.comm, and its naturality
    uses the specified Mathlib extension/restriction maps. Both are pointwise
    linear equivalences, not categorical natural isomorphisms or laws about
    identity/composition coherence or compatibility with carrier lifts.

  main_results:
    - declaration: "Module.Free.right_regular"
