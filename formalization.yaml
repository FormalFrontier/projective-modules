version: "v0.4"

project:
  name: "Projective modules"
  description: >-
    Reusable Lean theory of projective modules: finite-projective dual and
    evaluation base change, invertible modules, exterior algebras and powers,
    determinants, bounded cancellation and countable absorption, infinite free
    coordinates, finite stable presentations and IBN-only integer-rank
    independence, balanced tensor products and right scalar extension, exactness,
    local and PID freeness,
    preadditive stable module categories, countably generated submodules over
    left-Noetherian rings, and locally constant rank and componentwise-free
    classification. Noncommutative and commutative results retain their distinct
    hypotheses; rank classification is not asserted for all finite projectives.
    Over arbitrary rings, the library also describes stably-free kernels of
    surjections onto finitely generated stably-free targets, finite-coordinate
    kernel presentations and surjective right-linear matrix kernels.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29, Chapter I module and projective-module
      material, including Definition I.1.2 on finite stable coordinates,
      Example I.2.1.2 and the exterior-power Sum Formula on displayed pages
      18-19 (physical PDF pages 26-27).
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The source motivates reusable projective-module and exterior results,
      without a claim to formalize every declaration, chapter or exercise.
      The complete-book build dated 2013-08-29 has the exterior-power Sum
      Formula on displayed pages 18-19 (physical PDF pages 26-27); print
      pagination differs. No book PDF or passage excerpt is shipped. The
      bibliography is not the provenance of individual Lean expressions.

