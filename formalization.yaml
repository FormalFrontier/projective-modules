    - declaration: "ModuleCat.FiniteProjective.isoClass"
      file: "ProjectiveModules/Category/FiniteProjectiveSmallness.lean"
      note: >-
        Send arbitrary finite projective inputs to the existing skeleton of
        ModuleCat.FiniteProjective.{u,u} R after taking a ring-universe
        representative. Applying this to Rᵐᵒᵖ gives right-module classes.
        This is not a K₀ group or a group-completion construction.
    - declaration: "ModuleCat.FiniteProjective.isoClass_eq_iff"
      file: "ProjectiveModules/Category/FiniteProjectiveSmallness.lean"
      note: >-
        Equality of classes in the same ring-universe reference skeleton is
        equivalent to Nonempty (P ≃ₗ[R] Q) for finite projective inputs whose
        carrier universes may differ, with no commutativity or nontriviality
        assumption on R.
    - declaration: "KTheory.ProjectiveClass"
      file: "ProjectiveModules/KTheory/K0.lean"
      note: >-
        Ring-universe additive commutative monoid of direct-sum isomorphism
        classes of finite projective right modules over an arbitrary ring,
        using the complete ring-universe reference category. Module generators
        accept arbitrary independent carrier universes without a Small premise.
    - declaration: "KTheory.ProjectiveClass.of_eq_iff"
      file: "ProjectiveModules/KTheory/K0.lean"
      note: >-
        Equality of module classes is exactly nonempty linear equivalence,
        including inputs in independent universes. Zero, product, representative
        and carrier-lift equations give the characteristic generator API.
    - declaration: "KTheory.ProjectiveClass.lift"
      file: "ProjectiveModules/KTheory/K0.lean"
      note: >-
        Isomorphism-invariant object functions preserving zero and binary
        direct sums descend to additive maps into any AddZero target, with
        reference/module evaluation, extensionality and uniqueness laws.
    - declaration: "KTheory.K0"
      file: "ProjectiveModules/KTheory/K0.lean"
      note: >-
        Mathlib's additive Grothendieck group of the projective class monoid,
        in the ring universe, for arbitrary rings including the zero ring.
        For arbitrary rings, generator equality means common stabilization,
        not necessarily module isomorphism.
    - declaration: "KTheory.K0.lift"
      file: "ProjectiveModules/KTheory/K0.lean"
      note: >-
        Additive class maps to any additive commutative group extend uniquely
        to K₀ homomorphisms. Restriction is inverse to extension, and module
        generator evaluation and homomorphism extensionality are provided.
    - declaration: "KTheory.ProjectiveClass.map"
      file: "ProjectiveModules/KTheory/ScalarExtension.lean"
      note: >-
        Scalar extension along an arbitrary unital ring homomorphism induces
        an additive map on finite-projective right-module classes. Evaluation
        accepts independent carrier universes; identity and composition agree
        as whole homomorphisms, including noncommutative and zero rings.
    - declaration: "KTheory.K0.map"
      file: "ProjectiveModules/KTheory/ScalarExtension.lean"
      note: >-
        The induced K₀ map extends the class map through group completion,
        agrees on every class and arbitrary-carrier module generator, and
        respects identity and composition as whole homomorphisms. This general-ring
        scalar-extension API alone asserts no injectivity, dimension classification
        or cancellation of projective modules.
    - declaration: "KTheory.ProjectiveClass.map_eq_map"
      file: "ProjectiveModules/KTheory/ScalarExtension.lean"
      note: >-
        Any two unital homomorphisms from a fixed division ring to a fixed ring
        induce equal whole additive class maps. A finite source basis compares
        both extensions with the same target coordinate module; the target may
        be noncommutative or a zero ring, without a target dimension invariant.
    - declaration: "KTheory.K0.map_eq_map"
      file: "ProjectiveModules/KTheory/ScalarExtension.lean"
      note: >-
        The whole K₀ homomorphisms induced by two maps from a division ring to
        an arbitrary ring agree, by the class equality and group-completion
        extensionality. No injectivity of the class-to-K₀ map is assumed.
    - declaration: "KTheory.K0.exists_sub"
      file: "ProjectiveModules/KTheory/Stabilization.lean"
      note: >-
        Every K₀ element is a difference of two finite projective right-module
        generators in the complete ring-universe reference category. The chosen
        representative pair has a reconstruction law, not uniqueness or additivity.
    - declaration: "KTheory.K0.of_eq_iff_exists_projective_stabilizer"
      file: "ProjectiveModules/KTheory/Stabilization.lean"
      note: >-
        Two finite projective generators agree exactly when their modules become
        linearly equivalent after adjoining one common finite projective module
        in the ring universe. No module cancellation or nonzero-ring premise.
    - declaration: "KTheory.K0.of_eq_iff_exists_free_stabilizer"
      file: "ProjectiveModules/KTheory/Stabilization.lean"
      note: >-
        Generator equality is equivalent to linear equivalence after adjoining
        the same Fin n → Rᵐᵒᵖ. The rank n is existential, without IBN or a
        prescribed rank; input carrier universes may differ.
    - declaration: "KTheory.K0.sub_eq_sub_iff_exists_projective_stabilizer"
      file: "ProjectiveModules/KTheory/Stabilization.lean"
      note: >-
        Equality [P] - [Q] = [P'] - [Q'] is equivalent to linear equivalence of
        the cross-sums P × Q' and P' × Q after one common finite projective
        stabilizer. All four input carrier universes are independent.
    - declaration: "KTheory.K0.sub_eq_sub_iff_exists_free_stabilizer"
      file: "ProjectiveModules/KTheory/Stabilization.lean"
      note: >-
        The same difference equality is equivalent to stabilization of its
        cross-sums by one common standard finite free module. Cancellation is
        in the abelian group only, not among projective modules.
    - declaration: "KTheory.ProjectiveClass.finrankHom"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        Finite dimension descends to a natural-valued additive class map over
        a division ring. Evaluation requires finite generation, with freeness
        and projectivity supplied by division-ring scalars. This is the whole
        forward homomorphism of ProjectiveClass.finrankEquiv.
    - declaration: "KTheory.ProjectiveClass.finrankEquiv"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        For DivisionRing D, an AddEquiv ProjectiveClass D ≃+ ℕ whose forward
        homomorphism is the canonical finrankHom. Its inverse sends every n
        to the class of Fin n → Dᵐᵒᵖ. Both canonical-map round trips,
        arbitrary-carrier finite-module evaluation and dimension recovery,
        and regular-class one and inverse-one laws are provided.
    - declaration: "KTheory.K0.finrankHom"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        Integer-valued K₀ dimension uniquely extends natural class dimension,
        evaluates on finitely generated modules in arbitrary carrier universes,
        and sends the regular generator to one. This is the whole forward
        homomorphism of K0.finrankEquiv.
    - declaration: "KTheory.K0.finrankEquiv"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        For DivisionRing D, an AddEquiv K0 D ≃+ ℤ whose forward homomorphism
        is the canonical finrankHom. Its inverse sends every integer z,
        including negatives, to z • K0.of D Dᵐᵒᵖ; natural casts recover
        finite-coordinate generators. Both canonical-map round trips,
        arbitrary-carrier finite-module evaluation and dimension recovery,
        regular-generator one and inverse-one laws, and class-completion
        compatibility are provided. Equality of finite-module generators
        is equivalent to right-linear isomorphism over division rings only.
    - declaration: "KTheory.ProjectiveClass.finrankHom_comp_map"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        Scalar extension along any unital φ : D →+* S between division rings
        preserves natural class dimension as an equality of whole canonical
        additive homomorphisms, with independent scalar universes.
    - declaration: "KTheory.K0.finrankHom_comp_map"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        The induced K₀ scalar-extension map along the same arbitrary unital
        division-ring homomorphism preserves integer dimension as an equality
        of whole canonical homomorphisms, by group completion.
    - declaration: "KTheory.ProjectiveClass.map_bijective"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        Scalar extension along any unital homomorphism between division rings
        induces a bijective additive class map, using the canonical natural
        dimension equivalences and their whole-map compatibility. The scalar
        homomorphism need not be surjective; its universes are independent.
    - declaration: "KTheory.K0.map_bijective"
      file: "ProjectiveModules/KTheory/Rank.lean"
      note: >-
        The induced K₀ map between division rings is bijective, using the
        canonical integer dimension equivalences and naturality. This concerns
        all group elements, including negative regular-generator multiples,
        not only the positive class generators.
    - declaration: "KTheory.K0.subsingleton_of_subsingleton"
      file: "ProjectiveModules/KTheory/ZeroRing.lean"
      note: >-
        The entire K₀ group of a subsingleton ring is a subsingleton, as is
        the direct-sum class monoid. Generator normalization does not use the
        nonadditive zero-ring convention for module finrank.
    - declaration: "ModuleCat.Stable.quotient_map_eq_iff"
      file: "ProjectiveModules/Category/Stable.lean"
      note: "Stable equality is factorization of the difference through a projective; the quotient is preadditive."
    - declaration: "ModuleCat.FactorsThroughProjective.iff_ext_one_precomp_eq_zero"
      file: "ProjectiveModules/Category/Stable.lean"
      note: >-
        Detect projective factorization by all Ext-one precomposition maps;
        retains the Small.{uM} R universe hypothesis. No abelian stable-category
        structure, completed-group-ring duality or transpose theory is asserted.
    - declaration: "BalancedTensorProduct.lift"
      file: "ProjectiveModules/Module/BalancedTensorProduct.lean"
      note: "Universal additive balanced map for a right and a left module over an arbitrary ring."
    - declaration: "Module.Projective.balancedTensor_short_exact"
      file: "ProjectiveModules/Module/BalancedTensorExact.lean"
      note: "Tensoring a left-module short exact pair with a fixed projective right module preserves exactness."
    - declaration: "Module.Projective.hom_short_exact"
      file: "ProjectiveModules/Module/HomExact.lean"
      note: "Additive Hom exactness for a projective source over an arbitrary semiring."
    - declaration: "Module.piRightModule"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        Named coordinatewise opposite-scalar action on a family of semimodules
        over a family of semirings. Index, coefficient and carrier universes
        are independent; the family need not be finite. No global action
        instance or unital coordinate-inclusion homomorphism is introduced.
    - declaration: "Module.projective_piRight"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        For a finite index, coefficient-product assembly preserves arbitrary
        projectivity over semirings, without finite-generation assumptions.
        Independently sized binary semiring factors have the corresponding
        projective closure theorem.
    - declaration: "ModuleCat.FiniteProjective.pi"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        Canonical coefficient-product bundle of a finite family of
        finite-projective right modules over arbitrary rings. Finite
        generation and projectivity of the output are proved, with carrier,
        coordinate, action, extensionality and finite reconstruction APIs.
    - declaration: "ModuleCat.FiniteProjective.prodRight"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        Binary finite-projective coefficient-product assembly with separately
        quantified scalar and carrier universes. Zero module factors and
        zero coefficient rings are not excluded.
    - declaration: "ModuleCat.RightExtension.piRecoverLinearEquiv"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        Extension of an assembled right-module family along a coordinate
        projection recovers that factor, with forward and inverse pure-tensor
        formulas. The index need not be finite; no finite-generation or
        projectivity premise is required.
    - declaration: "ModuleCat.RightExtension.piLinearEquiv"
      file: "ProjectiveModules/Module/RightProduct.lean"
      note: >-
        An arbitrary right module over a finite product of arbitrary rings
        is linearly equivalent to the product of its coordinate projection
        extensions. Both directions use the balanced tensor construction and
        supported coordinate idempotents; scalar, index and carrier universes
        are independent, including empty families and zero rings.
    - declaration: "KTheory.ProjectiveClass.piEquiv"
      file: "ProjectiveModules/KTheory/Product.lean"
      note: >-
        Additive monoid equivalence from finite-projective classes over a
        finite coefficient product of arbitrary rings to the family of
        factor classes, with the existing projection scalar-extension maps
        as its forward homomorphism. The inverse assembles canonical
        coefficient-product modules; whole-hom, coordinate, module-generator
        and equality-detection laws include empty families and zero rings.
    - declaration: "KTheory.ProjectiveClass.prodEquiv"
      file: "ProjectiveModules/KTheory/Product.lean"
      note: >-
        Binary projective-class additive equivalence along the two projection
        scalar extensions, with separately quantified scalar and module
        carrier universes. Factors need not be commutative or nontrivial;
        no cancellation of classes is required.
    - declaration: "KTheory.K0.piEquiv"
      file: "ProjectiveModules/KTheory/Product.lean"
      note: >-
        Additive group equivalence between K0 of a finite product of arbitrary
        rings and the family of factor K0 groups. Forward whole-hom and
        coordinate formulas agree with projection scalar extension; inverse
        module-generator, group-completion and signed-presentation formulas
        compute general differences of finite-projective classes, without
        assuming injectivity of the class-to-K0 map.
    - declaration: "KTheory.K0.prodEquiv"
      file: "ProjectiveModules/KTheory/Product.lean"
      note: >-
        Binary K0 additive equivalence with independent scalar and carrier
        universes, inverse generator and signed formulas, and coordinate
        equality detection. Zero rings and noncommutative factors are
        included; signed classes do not require cancellation.
    - declaration: "ModuleCat.RightExtension.adjunction"
      file: "ProjectiveModules/Module/RightExtension.lean"
      note: "Right-module scalar extension/restriction adjunction for arbitrary ring maps, with finite/projective preservation."
    - declaration: "IsIdempotentElem.rightSpanFiniteProjective"
      file: "ProjectiveModules/Module/RightExtensionIdeal.lean"
      note: "Bundle the principal right ideal of an idempotent over an arbitrary ring as a finite projective right module."
    - declaration: "ModuleCat.RightExtension.spanFiniteProjective"
      file: "ProjectiveModules/Module/RightExtensionIdeal.lean"
      note: "Bundle scalar extension of an idempotent right ideal as a finite projective right module over arbitrary source and target rings."
    - declaration: "ModuleCat.RightExtension.spanLinearEquivOfMapEqOne"
      file: "ProjectiveModules/Module/RightExtensionIdeal.lean"
      note: >-
        Along an arbitrary ring map from R to S, the
        principal right ideal generated by op e extends to the regular right
        S-module when f e = 1. No idempotence, centrality of the generator or
        whole homomorphism image, commutativity or nontriviality hypothesis
        is imposed. The image of e itself is necessarily central. Forward
        evaluation is m tensor s mapped to op (f (unop m) * s), with
        the inverse given by the tensor of e with the target scalar.
    - declaration: "ModuleCat.RightExtension.span_subsingleton_of_map_eq_zero"
      file: "ProjectiveModules/Module/RightExtensionIdeal.lean"
      note: >-
        Over arbitrary source and target rings, extension of the right ideal
        generated by an idempotent e is a subsingleton when f e = 0,
        including the zero-ring cases. The proof uses idempotent action
        only on the generator, then principal generation and balancing;
        the idempotent need not fix every member of the source ideal.
    - declaration: "ModuleCat.RightExtension.tmulOne_surjective"
      file: "ProjectiveModules/Module/RightExtension.lean"
      note: "The canonical scalar-extension map is surjective when the coefficient homomorphism is surjective."
    - declaration: "ModuleCat.RightExtension.idealQuotientLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionQuotient.lean"
      note: "Scalar extension along a two-sided ideal quotient agrees with the right-module ideal-action quotient."
    - declaration: "ModuleCat.RightExtension.finrank_idealQuotient_prod_of_isMaximal"
      file: "ProjectiveModules/Module/RightExtensionFiniteResidue.lean"
      note: "Residue dimensions add for finite modules, retaining two-sided/maximal and division-quotient hypotheses."
    - declaration: "ModuleCat.RightExtension.rightFreeLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionFree.lean"
      note: "Explicit scalar extension of finite standard right-free modules, including empty coordinates."
    - declaration: "ModuleCat.RightExtension.idLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionComparison.lean"
      note: >-
        Identity extension of an arbitrary right module over a ring is linearly
        equivalent to the original module: m ⊗ r maps to op r • m and the
        inverse sends m to m ⊗ 1. Scalar and module universes are independent;
        no finite-generation, projectivity or nontriviality premise is needed.
    - declaration: "ModuleCat.RightExtension.compLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionComparison.lean"
      note: >-
        For arbitrary ring homomorphisms φ : R →+* S and ψ : S →+* T,
        iterated right extension is linearly equivalent to extension along
        ψ.comp φ. The pure-tensor formula is (m ⊗ s) ⊗ t ↦ m ⊗ (ψ s * t),
        with inverse m ⊗ t ↦ (m ⊗ 1) ⊗ t, preserving multiplication order.
        Scalar and module universes are independent; no commutativity,
        injectivity, surjectivity, finiteness or projectivity is assumed.
    - declaration: "ModuleCat.RightExtension.compLinearEquiv_id_left"
      file: "ProjectiveModules/Module/RightExtensionComparisonCoherence.lean"
      note: >-
        Composition comparison with an identity first equals scalar extension
        of the identity comparison as a linear map. Both send (m ⊗ r) ⊗ s
        to m ⊗ (φ r * s), for arbitrary rings and right modules with independent
        scalar and module universes. This is a simp law.
    - declaration: "ModuleCat.RightExtension.compLinearEquiv_id_right"
      file: "ProjectiveModules/Module/RightExtensionComparisonCoherence.lean"
      note: >-
        Composition comparison with an identity last equals the identity
        comparison on the extended module as a linear equivalence. Both
        evaluate z ⊗ s by the right S-action on z, over arbitrary rings and
        right modules with independent scalar and module universes.
        This is a simp law.
    - declaration: "ModuleCat.RightExtension.compLinearEquiv_assoc"
      file: "ProjectiveModules/Module/RightExtensionComparisonCoherence.lean"
      note: >-
        Comparing the first two extensions and then the third equals comparing
        the last two and then the first, as linear maps. For arbitrary rings
        R, S, T, U, ring homomorphisms φ, ψ, θ and a module with only an
        AddCommGroup and a Module Rᵐᵒᵖ action, all five universes are independent.
        The pure-tensor identity is θ (ψ s * t) * u = θ (ψ s) * (θ t * u).
        No commutativity, injectivity, surjectivity, freeness, finiteness or
        projectivity is required, and no categorical coherence is asserted.
    - declaration: "ModuleCat.RightExtension.tensorProductObj_smul_tmul"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        Right target scalars act on the module-first tensor by coefficient right
        multiplication s * t, for a commutative base and arbitrary ring target;
        no central image is assumed.
    - declaration: "ModuleCat.RightExtension.tensorProductLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        For CommRing R, Ring S and any right R-module in an independent
        universe, right extension along a unital φ agrees with the module-first
        Mathlib tensor using the canonical restricted source and coefficient
        actions.
    - declaration: "ModuleCat.RightExtension.tensorProductLinearEquiv_tmul"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        The module-first comparison sends the balanced pure tensor m tensor s to
        tensorProductTmul φ M m s with the specified coefficient action.
    - declaration: "ModuleCat.RightExtension.tensorProductLinearEquiv_symm_tmul"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        The inverse module-first comparison sends that Mathlib pure tensor to
        the corresponding balanced pure tensor.
    - declaration: "ModuleCat.RightExtension.tensorProductLinearEquiv_naturality"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        For a morphism of right modules in a common carrier universe, the
        comparison intertwines extension of the source map with its restricted
        tensor map and the identity of the specified coefficient module.
    - declaration: "ModuleCat.RightExtension.tensorProductLinearEquiv_functor'_map"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        The same module-first intertwining law uses the right-extension
        functor' map, with independent source and output carrier universes.
    - declaration: "ModuleCat.RightExtension.extendScalarsLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        For CommRing R and CommRing S, right extension agrees pointwise with the
        right-module view of Mathlib's scalar-first ModuleCat.extendScalars φ;
        the output carrier is in max uM uS.
    - declaration: "ModuleCat.RightExtension.extendScalarsLinearEquiv_tmul"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        The scalar-first comparison sends m tensor s to s tensor m using the
        canonical homomorphism-induced coefficient module and opposite source
        view.
    - declaration: "ModuleCat.RightExtension.extendScalarsLinearEquiv_symm_tmul"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        The inverse scalar-first comparison sends s tensor m to the
        corresponding module-first balanced pure tensor.
    - declaration: "ModuleCat.RightExtension.extendScalarsLinearEquiv_eq_comm"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        On carriers, the scalar-first comparison is TensorProduct.comm after the
        module-first comparison for the same specified module structures.
    - declaration: "ModuleCat.RightExtension.extendScalarsLinearEquiv_naturality"
      file: "ProjectiveModules/Module/RightExtensionTensorProduct.lean"
      note: >-
        Pointwise scalar-first naturality intertwines right extension of a
        module morphism with the maps of Mathlib's extension and both opposite
        scalar restriction functors.
    - declaration: "Module.rightFreeLinearMapScalarExtension"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Transport a supplied right-linear map from ι → R to κ → R along any
        unital homomorphism R →+* S of semirings. Only the source requires a
        Fintype instance; the target is arbitrary. Scalar and index universes
        are independent. Empty indices and zero semirings are not excluded.
        No commutativity, injectivity, surjectivity, IBN or equal
        index cardinalities are assumed. The noncomputable constructor needs
        no caller DecidableEq instance. Laws cover zero, addition, identities,
        coefficient images and coefficient-homomorphism composition.
    - declaration: "Module.rightFreeScalarExtensionEquiv"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Under the same semiring and homomorphism hypotheses, transport a
        supplied right-linear equivalence and its inverse, with Fintype
        instances on both indices in independent universes. This does not
        assert that unequal finite ranks admit an equivalence. Laws give
        compatibility with the underlying transported map, inverse,
        equivalence composition, identity and coefficient-homomorphism
        identity and composition, without caller DecidableEq instances.
    - declaration: "Module.rightFreeLinearMapScalarExtension_apply"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        For a finite source and arbitrary target, the i-th coordinate on y is
        ∑ j, f (g (Pi.single j 1) i) * y j. Coefficients multiply on the left;
        opposite-semiring module scalars act on the right. The single-vector
        and entrywise opposite-coordinate row-matrix laws characterize the
        same transport.
    - declaration: "Module.rightFreeLinearMapScalarExtension_map_comp"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Transport respects composition when the source and intermediate
        coordinate types have Fintype instances; the final target is
        arbitrary. All three index universes remain independent.
    - declaration: "Module.rightFreeScalarExtensionEquiv_apply"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        For a supplied equivalence with both coordinate types finite, the
        i-th coordinate on y is ∑ j, f (e (Pi.single j 1) i) * y j, agreeing
        with transport of its underlying right-linear map.
    - declaration: "Module.rightFreeLinearMapScalarExtension_eq_rightExtension_of_decidableEq"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Over rings with both indices finite, identify coefficient transport
        with the unbundled ModuleCat.RightExtension.map conjugated by the
        finite right-free coordinate equivalences. This variant uses the
        caller's DecidableEq instances on both indices; the corresponding
        rightFreeLinearMapScalarExtension_eq_rightExtension law chooses them
        internally. These are data-compatibility bridges, not extra
        mathematical premises of the semiring constructor.
    - declaration: "Module.rightFreeLinearMapScalarExtension_tmul_of_decidableEq"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Over rings with both indices finite and caller DecidableEq instances,
        compatibility on pure tensors sends the coordinates of x ⊗ s to
        those of g x ⊗ s. The rightFreeLinearMapScalarExtension_tmul law chooses
        equality decisions internally. No infinite-product tensor
        equivalence is asserted by arbitrary-target map transport.
    - declaration: "Module.rightFreeScalarExtensionEquiv_toLinearMap_eq_rightExtension_of_decidableEq"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Over rings with both indices finite, the underlying map of a supplied
        transported equivalence agrees with the unbundled tensor map in
        finite right-free coordinates, using caller DecidableEq instances.
        The rightFreeScalarExtensionEquiv_toLinearMap_eq_rightExtension law
        chooses equality decisions internally. Independent index and scalar
        universes are retained.
    - declaration: "Module.rightEndomorphismMatrixEquiv"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: >-
        Column-convention square matrices represent opposite-scalar linear
        endomorphisms with same-order composition. The square
        rightEndomorphismScalarExtension specializes rectangular coefficient
        transport and retains its finite-coordinate Ring tensor bridge.
    - declaration: "Module.rightEndomorphism_bijective_of_quotientScalarExtension_bijective"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: "Reflect finite right-module invertibility through a quasiregular two-sided quotient, not arbitrary quotients."
    - declaration: "Module.Projective.exists_fin_generating_family_iff_exists_prod_equiv"
      file: "ProjectiveModules/Module/ProjectiveComplement.lean"
      note: "Explicit n-generator/projective-complement equivalence, including the zero-generator case."
    - declaration: "Module.Basis.exists_hasMinimalSupport"
      file: "ProjectiveModules/Module/MinimalSupport.lean"
      note: "Minimal support relative to a supplied fixed-index basis."
    - declaration: "Module.Projective.free_of_isUnit_compl"
      file: "ProjectiveModules/Module/LocalProjective.lean"
      note: >-
        Finite projective right modules are free given a proper two-sided ideal
        whose complement consists of units. The ring hypotheses exclude the
        zero ring; the zero module and zero rank remain allowed.
    - declaration: "Module.Projective.exists_fin_rightFree_split_containing"
      file: "ProjectiveModules/Module/LocalProjectiveElement.lean"
      note: "Under the same proper-ideal/unit-complement hypotheses, contain an element in a finite right-free split summand."
    - declaration: "Module.CountablyGenerated"
      file: "ProjectiveModules/Module/CountablyGenerated.lean"
      note: "Sequence-spanning countable generation, including padded finite families and countable supported free modules."
    - declaration: "Module.CountablyGenerated.submodule_of_isNoetherianRing"
      file: "ProjectiveModules/Module/CountablyGenerated/Noetherian.lean"
      note: "Every submodule of a sequence-spanned module over a possibly noncommutative left-Noetherian ring is countably generated; no ambient Noetherian, free or projective module assumption."
    - declaration: "Module.Projective.exists_fin_rightFree_biorthogonal_exhaustion_of_countablyGenerated"
      file: "ProjectiveModules/Module/CountableLocalProjective.lean"
      note: "Countable finite-free biorthogonal exhaustion for projectives under proper-ideal/unit-complement hypotheses."
    - declaration: "Module.Projective.exists_sigma_fin_rightBasis_of_countablyGenerated"
      file: "ProjectiveModules/Module/CountableLocalProjectiveFree.lean"
      note: "Assemble that exhaustion into a basis indexed by a sigma of finite blocks, allowing rank-zero blocks."
    - declaration: "LinearMap.exists_countable_invariant_supported"
      file: "ProjectiveModules/Module/CountableCoordinateClosure.lean"
      note: "Countable invariant supported closure for an endomorphism of a standard free module; no idempotence assumption."
    - declaration: "LinearMap.exists_countable_invariant_coordinate_filtration"
      file: "ProjectiveModules/Module/TransfiniteCoordinateFiltration.lean"
      note: "Well-ordered exhaustive invariant coordinate filtration with countable increments; ambient basis need not be countable."
    - declaration: "LinearMap.supportedRangeProdComplementEquiv"
      file: "ProjectiveModules/Module/InvariantSupportedProjection.lean"
      note: "Split nested invariant supported ranges of an idempotent; complementary increments are projective."
    - declaration: "LinearMap.supportedRangeComplement_countablyGenerated"
      file: "ProjectiveModules/Module/InvariantSupportedProjection.lean"
      note: "Countable coordinate differences give countably generated complements with the stated invariance and idempotence."
    - declaration: "LinearMap.CountableInvariantCoordinateFiltration.range_free_of_free_increments"
      file: "ProjectiveModules/Module/TransfiniteRangeBasis.lean"
      note: "An idempotent range is free when its filtration increments are free; not an unconditional free-range claim."
    - declaration: "Module.Projective.free_of_isUnit_compl_arbitraryRank"
      file: "ProjectiveModules/Module/ArbitraryLocalProjectiveFree.lean"
      note: "Arbitrary-rank projective right-module freeness under the proper-ideal/unit-complement hypotheses."
    - declaration: "Module.Projective.free_of_pid"
      file: "ProjectiveModules/Module/PID.lean"
      note: "Every projective over a commutative PID is free, using arbitrary-rank free-submodule freeness."
    - declaration: "LaurentPolynomial.module_free_of_finite_projective"
      file: "ProjectiveModules/Module/LaurentPolynomial.lean"
      note: "Finite projectives over one-variable Laurent polynomials over a field are free, with a separate opposite-ring endpoint."
    - declaration: "IsIdempotentElem.free_span_iff"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: >-
        For a commutative semiring R and idempotent e,
        Module.Free R (Ideal.span {e}) iff e = 0 or e = 1. Includes the zero
        and unit ideals and the zero semiring; no nontriviality, domain or
        local hypothesis is required.
    - declaration: "IsIdempotentElem.not_free_span"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: >-
        For a commutative semiring and idempotent e with e ≠ 0 and e ≠ 1,
        the principal ideal Ideal.span {e} is not free. Nontriviality of the
        ideal is derived from its nonzero generator, not assumed.
    - declaration: "IsIdempotentElem.smul_span"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: >-
        Over a commutative semiring, an idempotent e acts identically on its
        principal ideal: e • x = x for every x : Ideal.span {e}.
    - declaration: "IsIdempotentElem.one_sub_smul_span"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: >-
        Over a commutative ring, the complementary idempotent annihilates
        the principal ideal: (1 - e) • x = 0 for every x : Ideal.span {e},
        assuming IsIdempotentElem e.
    - declaration: "ModuleCat.FiniteProjective.rankAtStalk_ofLocallyConstantRank"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: "Every locally constant natural-valued prime-spectrum function is realized by a finite projective over a commutative ring."
    - declaration: "ModuleCat.FiniteProjective.prodComplementEquiv"
      file: "ProjectiveModules/Module/LocallyConstantRank.lean"
      note: "Explicit finite-standard-free complement of the threshold-idempotent realization."
    - declaration: "Module.rankFiberRingEquiv"
      file: "ProjectiveModules/Module/RankFiberDecomposition.lean"
      note: "Decompose the commutative base ring along a finite projective's nonempty rank fibers."
    - declaration: "Module.rankFiberLinearEquiv"
      file: "ProjectiveModules/Module/RankFiberDecomposition.lean"
      note: "Reconstruct the finite projective from rank-fiber base changes, including the empty-spectrum zero ring."
    - declaration: "Module.ComponentwiseFree.nonempty_linearEquiv_of_rankAtStalk_eq"
      file: "ProjectiveModules/Module/ComponentwiseFree.lean"
      note: "Componentwise-free modules in independent universes with equal stalk ranks are linearly equivalent."
    - declaration: "ModuleCat.componentwiseFreeSkeletonEquiv"
      file: "ProjectiveModules/Module/ComponentwiseFree.lean"
      note: "Locally constant ranks classify the skeleton of componentwise-free finite projectives, not all finite projectives."
    - declaration: "Module.End.subsingleton_of_linearEquiv_prod"
      file: "ProjectiveModules/Module/SummandCancellation.lean"
      note: >-
        Over a semiring, a Dedekind-finite endomorphism monoid of M forces P to
        be subsingleton whenever M is linearly equivalent to M × P. Neither
        finite generation nor freeness is needed; scalar, M and P universes
        are independent.
    - declaration: "RankCondition.card_le_of_linearEquiv_prod"
      file: "ProjectiveModules/Free/FiniteFreeSummand.lean"
      note: >-
        Over a semiring with the rank condition, finite bases of M and N give
        the target basis cardinality at most the source basis cardinality if
        M is linearly equivalent to N × P for any semimodule P. Scalar, module,
        complement and basis-index universes are independent.
    - declaration: "IsStablyFiniteRing.subsingleton_of_linearEquiv_prod"
      file: "ProjectiveModules/Free/FiniteFreeSummand.lean"
      note: >-
        A finite-free semimodule over a stably finite semiring cancels from an
        equivalence with itself times any complementary semimodule; scalar,
        module and complement universes are independent.
    - declaration: "IsStablyFiniteRing.subsingleton_of_finite_projective_linearEquiv_prod"
      file: "ProjectiveModules/Free/FiniteFreeSummand.lean"
      note: >-
        A finite projective module over a stably finite ring cancels from an
        equivalence with itself times any complementary module, with independent
        scalar, module and complement universes.
    - declaration: "rankCondition_iff_le_of_fin_linearEquiv_fin_prod"
      file: "ProjectiveModules/Free/FiniteFreeSummand.lean"
      note: >-
        For a ring, the rank condition is equivalent to n ≤ m whenever a finite
        coordinate module of size m is linearly equivalent to one of size n
        times a complementary module in the ring's universe. The converse does
        not assert splitting for arbitrary semirings.
    - declaration: "isStablyFiniteRing_iff_subsingleton_of_fin_linearEquiv_fin_prod"
      file: "ProjectiveModules/Free/FiniteFreeSummand.lean"
      note: >-
        For a ring, stable finiteness is equivalent to every equivalence from
        the finite coordinate module of size n to itself times P forcing P to
        be subsingleton, for complements P in the ring's universe. No
        arbitrary-semiring converse is claimed.

automation:
  methods:
    - method: "agent"
      framework: "AI agents using Lean and Lake"
      tool_setup: >-
        Formal Frontier AI agents used Lean and mathlib APIs, compiler feedback
        and tactics. Prism contributed original results; separately authored
        mathematics and expression adaptations are credited in docs/CREDITS.md.
      prompting_notes: >-
        Prompts emphasized exact hypotheses, handedness, independent universes
        and reusable mathematical APIs.
  notes: >-
    Code and documentation include AI-agent contributions. AI generation
    alone establishes no originality, proof correctness or rights clearance.

fidelity:
  divergences: >-
    Right modules use opposite-ring actions; balanced tensor respects
    noncommutative order and semiring Hom exactness is additive. Full exterior
    algebra base change is not fixed-degree scalar extension; the binary Sum
    Formula is separate. Over arbitrary rings, rank does not classify all finite
    projectives; the commutative stalk-rank classification concerns the
    componentwise-free finite projectives. The stable category is preadditive, not
    abelian; the Ext-one criterion requires Small.{uM} R. Countable and
    finite-summand cancellation are bounded; semisimple freeness requires
    finite stably-free modules. Proper-ideal/unit-complement local freeness
    excludes zero rings, whereas some rank constructions include them.
    Transfinite range freeness requires an idempotent and free increments.
    PID freeness allows arbitrary rank over a commutative PID; the Laurent
    endpoint covers one variable over a field, not general Quillen-Suslin.
    Finite-binder componentwise models retain finiteness and idempotence.
    Infinite-coordinate results do not assert Module.rank equality or
    finite-rank invariance; their chosen index equivalence need not preserve
    basis vectors.
    K₀ is the group completion of all finite projective right-module classes,
    not a quotient imposing module cancellation. Finite-free stabilization uses
    an existential rank, without IBN. For arbitrary rings, these stabilization
    criteria do not identify K₀ generator equality with module isomorphism or
    provide a dimension classification. Over division rings, canonical dimension
    does give additive equivalences of the class monoid with ℕ and K₀ with ℤ,
    preserved by unital division-ring scalar extension; these are not ring
    equivalences. Scalar-map bijectivity and homomorphism independence are
    corollaries of the dimension and finite-free extension APIs, not assertions
    that scalar homomorphisms are surjective or that module categories or
    scalar-extension functors are identified. Independence requires only a ring
    target, whereas bijectivity here requires both scalars to be division rings.
    Allowing subsingleton rings generalizes the source's nonzero-ring
    convention; their entire class monoid and K₀ collapse, and module finrank
    is not an additive K₀ invariant in this case. Zero rings are not division rings.
    None of this decides source-wide formalization.

review:
  status: "agent-reviewed"
  notes: >-
    Mathematical content has received independent AI-agent review. Acceptance
    requires an applicable pinned build and complete transitive standard-axiom
    checks including private declarations; those checks do not establish
    source correspondence or rights clearance. This metadata is not itself
    acceptance evidence. No human review, book-author endorsement or
    complete-book formalization is claimed.

acknowledgements: >-
  Mathlib, General Linear Groups and Stable Range supply declared dependencies;
  their authorship and license notices remain upstream. Lean and Lake supply
  the proof assistant and build system. Charles A. Weibel is the cited book
  author, separately from project formalization authors. Project contributions
  are Apache-2.0; this assigns no copyright ownership or permission to
  relicense third-party expression.
  Weibel's Definition I.1.2 motivates finite-free kernel splitting; the more
  general kernel interfaces also use Mathlib's stably-free and matrix APIs and
  Prism's (Formal Frontier) finite stable presentation and projective splitting
  formalization. Right-extension comparisons and their pointwise unit and
  associativity laws use the balanced-tensor/right-extension formalization
  contributed by Prism and maintained by Prism and Lens, the comparison
  interfaces contributed by Lens, and Mathlib's ring-homomorphism and
  linear-map interfaces. Projective-class descent and stabilization follow
  the object-class and group-completion approach in Formal Frontier's Algebraic
  Direct Limits formalization without depending on that library. The K₀
  construction reuses Mathlib's skeleton, resizing, monoidal, additive
  Grothendieck group, localization and dimension APIs.
  The commutative-base tensor comparisons contributed by Lens reuse
  Mathlib's tensor universal property, commutation, tensor maps and module
  transport; the scalar-first target follows Jujian Zhang's Mathlib
  change-of-rings formalization.
