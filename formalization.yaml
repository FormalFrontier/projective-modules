        generated stably-free right-module kernel. Entries multiply coordinates
        on the left as A i j * x j. Empty index types and zero rings are included
        where surjectivity holds; no IBN, commutativity or free-kernel claim.
    - declaration: "mk_eq_mk_of_basis_of_infinite"
