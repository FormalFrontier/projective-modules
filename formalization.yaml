    - declaration: "Module.Free.countableFinsuppEquivOfProdFiniteFinsuppEquiv"
      file: "ProjectiveModules/Free/CountableCancellation.lean"
      note: "Cancel a finite free summand in countably infinite free coordinates; not arbitrary cancellation."
    - declaration: "Module.Free.prodNatFinsuppEquivOfSplit"
