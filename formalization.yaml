    - declaration: "Module.int_card_sub_eq_of_prod_linearEquiv"
      file: "ProjectiveModules/Free/StablePresentation.lean"
      note: "The associated integer coordinate differences agree without a rank condition, nonnegativity or natural subtraction."
    - declaration: "Module.IsStablyFree.ker_of_surjective"
      file: "ProjectiveModules/Free/StableKernel.lean"
      note: >-
        Over an arbitrary ring, a surjection from a stably-free module onto a
        finitely generated stably-free module has stably-free kernel. No finite
        generation of the domain is assumed or of the kernel is concluded.
    - declaration: "Module.finite_isStablyFree_iff_exists_fin_surjective_ker_equiv"
      file: "ProjectiveModules/Free/StableKernel.lean"
      note: >-
        Over an arbitrary ring, a module is finitely generated and stably free
        iff it is linearly equivalent to the kernel of a surjection between
        Fin n and Fin m coordinate modules for some natural m and n. This asserts
        neither a rank inequality nor an ordinary finite-presentation equivalence.
    - declaration: "Matrix.finite_isStablyFree_ker_mulVecBilin_of_surjective"
