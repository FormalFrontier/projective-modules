  main_results:
    - declaration: "IsBaseChange.toDualBaseChangeOfProjective"
      file: "ProjectiveModules/Dual/BaseChange.lean"
      note: "Canonical dual base change for finite projective modules over commutative semirings."
    - declaration: "IsBaseChange.contractBaseChangeEquivOfProjective"
      file: "ProjectiveModules/Contraction/BaseChange.lean"
      note: "Evaluation/contraction compatibility for finite projectives over commutative rings."
    - declaration: "ExteriorAlgebra.equivBaseChange"
      file: "ProjectiveModules/ExteriorAlgebra/BaseChange.lean"
      note: >-
        Full exterior-algebra base change over arbitrary commutative rings and
        modules; no finite, projective, flat or invertible-two assumption.
        This is not a fixed-degree scalar-extension equivalence.
    - declaration: "exteriorPower.prodEquivDirectSum"
      file: "ProjectiveModules/ExteriorPower/DirectSum.lean"
      note: >-
        Every-degree binary Sum Formula for arbitrary modules over a commutative
        ring, with ordered P-before-Q wedge inverse and degree zero included.
    - declaration: "exteriorPower.prodEquivDirectSum_naturality"
      file: "ProjectiveModules/ExteriorPower/DirectSum.lean"
      note: "Naturality for arbitrary linear maps over a fixed commutative base ring."
    - declaration: "exteriorPower.instProjective"
      file: "ProjectiveModules/ExteriorPower/Projective.lean"
      note: "Exterior powers preserve projectivity, without finite-generation assumptions."
    - declaration: "exteriorPower.determinant"
      file: "ProjectiveModules/ExteriorPower/Determinant.lean"
      note: "Scalar determinant construction assuming the chosen exterior power is invertible."
    - declaration: "Module.Basis.exteriorPower_determinant_eq_det"
      file: "ProjectiveModules/ExteriorPower/Top.lean"
      note: "Finite-basis top-exterior action agrees with the determinant, including rank zero."
    - declaration: "Module.invertible_iff_finite_projective_rankAtStalk_eq_one"
      file: "ProjectiveModules/Invertible/OfRankOne.lean"
      note: >-
        Invertibility iff finite projectivity and stalk rank one, with these
        properties on the right as propositions, not preinstalled hypotheses.
        The zero ring and empty spectrum are not excluded.
    - declaration: "Module.Invertible.toModuleEndRingEquiv"
      file: "ProjectiveModules/Invertible/Endomorphism.lean"
      note: "Every endomorphism of an invertible module is uniquely scalar."
    - declaration: "Module.Invertible.nonempty_linearEquiv_of_fin_stabilization"
      file: "ProjectiveModules/Invertible/StableCancellation.lean"
      note: "Finite-free stabilization cancellation between invertible modules only."
    - declaration: "Module.Free.countableFinsuppEquivOfProdFiniteFinsuppEquiv"
      file: "ProjectiveModules/Free/CountableCancellation.lean"
      note: "Cancel a finite free summand in countably infinite free coordinates; not arbitrary cancellation."
    - declaration: "Module.Free.prodNatFinsuppEquivOfSplit"
      file: "ProjectiveModules/Free/CountableAbsorption.lean"
      note: "Countable free absorption of a module given explicit split maps."
    - declaration: "Module.Free.rightIdealProdEndNatFinsuppEquiv"
      file: "ProjectiveModules/Free/CountableAbsorption.lean"
      note: "Corresponding absorption for complemented right ideals of a countable free endomorphism ring."
    - declaration: "Module.free_of_finite_isStablyFree_of_isSemisimpleRing"
      file: "ProjectiveModules/Free/Semisimple.lean"
      note: "Finite stably-free modules over arbitrary semisimple rings are free; not all semisimple modules."
    - declaration: "ModuleCat.FiniteProjective"
      file: "ProjectiveModules/Category/FiniteProjective.lean"
      note: "Finite projective modules as a full additive subcategory with finite biproducts over arbitrary rings."
    - declaration: "ModuleCat.Stable.quotient_map_eq_iff"
      file: "ProjectiveModules/Category/Stable.lean"
      note: "Stable equality is factorization of the difference through a projective; the quotient is preadditive."
    - declaration: "ModuleCat.FactorsThroughProjective.iff_ext_one_precomp_eq_zero"
      file: "ProjectiveModules/Category/Stable.lean"
      note: >-
        Detect projective factorization by all Ext-one precomposition maps;
        retains the Small.{uM} R universe hypothesis. No abelian stable-category
        structure, completed-group-ring duality or transpose theory is asserted.
    - declaration: "BalancedTensorProduct.lift"
      file: "ProjectiveModules/Module/BalancedTensorProduct.lean"
      note: "Universal additive balanced map for a right and a left module over an arbitrary ring."
    - declaration: "Module.Projective.balancedTensor_short_exact"
      file: "ProjectiveModules/Module/BalancedTensorExact.lean"
      note: "Tensoring a left-module short exact pair with a fixed projective right module preserves exactness."
    - declaration: "Module.Projective.hom_short_exact"
      file: "ProjectiveModules/Module/HomExact.lean"
      note: "Additive Hom exactness for a projective source over an arbitrary semiring."
    - declaration: "ModuleCat.RightExtension.adjunction"
      file: "ProjectiveModules/Module/RightExtension.lean"
      note: "Right-module scalar extension/restriction adjunction for arbitrary ring maps, with finite/projective preservation."
    - declaration: "ModuleCat.RightExtension.tmulOne_surjective"
      file: "ProjectiveModules/Module/RightExtension.lean"
      note: "The canonical scalar-extension map is surjective when the coefficient homomorphism is surjective."
    - declaration: "ModuleCat.RightExtension.idealQuotientLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionQuotient.lean"
      note: "Scalar extension along a two-sided ideal quotient agrees with the right-module ideal-action quotient."
    - declaration: "ModuleCat.RightExtension.finrank_idealQuotient_prod_of_isMaximal"
      file: "ProjectiveModules/Module/RightExtensionFiniteResidue.lean"
      note: "Residue dimensions add for finite modules, retaining two-sided/maximal and division-quotient hypotheses."
    - declaration: "ModuleCat.RightExtension.rightFreeLinearEquiv"
      file: "ProjectiveModules/Module/RightExtensionFree.lean"
      note: "Explicit scalar extension of finite standard right-free modules, including empty coordinates."
    - declaration: "Module.rightEndomorphismMatrixEquiv"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: "Column-convention matrices represent opposite-scalar linear maps with same-order composition."
    - declaration: "Module.rightEndomorphism_bijective_of_quotientScalarExtension_bijective"
      file: "ProjectiveModules/Module/RightEndomorphismMatrix.lean"
      note: "Reflect finite right-module invertibility through a quasiregular two-sided quotient, not arbitrary quotients."
    - declaration: "Module.Projective.exists_fin_generating_family_iff_exists_prod_equiv"
      file: "ProjectiveModules/Module/ProjectiveComplement.lean"
      note: "Explicit n-generator/projective-complement equivalence, including the zero-generator case."
    - declaration: "Module.Basis.exists_hasMinimalSupport"
      file: "ProjectiveModules/Module/MinimalSupport.lean"
      note: "Minimal support relative to a supplied fixed-index basis."
    - declaration: "Module.Projective.free_of_isUnit_compl"
      file: "ProjectiveModules/Module/LocalProjective.lean"
      note: >-
        Finite projective right modules are free given a proper two-sided ideal
        whose complement consists of units. The ring hypotheses exclude the
        zero ring; the zero module and zero rank remain allowed.
    - declaration: "Module.Projective.exists_fin_rightFree_split_containing"
      file: "ProjectiveModules/Module/LocalProjectiveElement.lean"
      note: "Under the same proper-ideal/unit-complement hypotheses, contain an element in a finite right-free split summand."
    - declaration: "Module.CountablyGenerated"
      file: "ProjectiveModules/Module/CountablyGenerated.lean"
      note: "Sequence-spanning countable generation, including padded finite families and countable supported free modules."
    - declaration: "Module.Projective.exists_fin_rightFree_biorthogonal_exhaustion_of_countablyGenerated"
      file: "ProjectiveModules/Module/CountableLocalProjective.lean"
      note: "Countable finite-free biorthogonal exhaustion for projectives under proper-ideal/unit-complement hypotheses."
    - declaration: "Module.Projective.exists_sigma_fin_rightBasis_of_countablyGenerated"
      file: "ProjectiveModules/Module/CountableLocalProjectiveFree.lean"
