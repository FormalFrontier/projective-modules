version: "v0.4"

project:
  name: "Projective modules"
  description: >-
    Reusable Lean theory of projective modules: finite-projective dual and
    evaluation base change, invertible modules, exterior algebras and powers,
    determinants, bounded cancellation and countable absorption, balanced tensor
    products and right scalar extension, exactness, local and PID freeness,
    stable module categories, and locally constant rank and componentwise-free
    classification. Noncommutative and commutative results retain their distinct
    hypotheses; rank classification is not asserted for all finite projectives.
  authors:
    - "Formal Frontier Agents"
    - "Prism (AI agent; theory, source research, integration and metadata)"
    - "formalization-worker-a (AI agent; three actual Tasks identified under automation)"
    - "formalization-worker-b (AI agent; three mathematical Tasks and two documentation-only Tasks identified under automation)"
    - "formalization-worker-a (AI agent; official-dependency and native-documentation successor identified under automation)"
    - "formalization-worker-a (AI agent; separate coordinate-stage source and native-documentation successor identified under automation)"
    - "formalization-worker-a (AI agent; later syntax, finite-binder and focused proof repairs identified under automation)"
    - "formalization-worker-a (AI agent; lightweight documentation assembly and source-inspected API corrections identified under automation)"
  responsible_maintainers:
    - "Prism (on behalf of the source-maintainer team)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: >-
      Complete-book build dated 2013-08-29, Chapter I module and projective-module
      material, including Example I.2.1.2 and the exterior-power Sum Formula on
      displayed pages 18-19 (physical PDF pages 26-27).
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Motivating mathematics is reorganized into source-independent interfaces
      and supporting constructions. This does not claim that every declaration
      is a transcription of a named book result, or complete coverage of any
      chapter, exercise or the book. The stable-module quotient and auxiliary
      exactness, coordinate-filtration and rank interfaces are general library
      developments; no source-specific correspondence follows just from their
      inclusion. Bibliographic authorship is distinct from Lean expression
      provenance below. The canonical private-project asset is library
      s-a1e29c47d014454b97d2ecbaef6b4282/v001, 4,958,181 bytes, SHA-256
      a04f53c9393b20672fab2a6818279b2f9996dbc7cf74735789ed13804b058845.
      The author-hosted source was supplied for the private project library;
      no explicit license or broader redistribution grant was established.
      Pagination differs from the AMS print edition. The selection-time errata
      URL returned HTTP 404; no errata original is included or claimed. No book
      PDF, scan or quoted passage is shipped in this repository.

