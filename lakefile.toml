name = "projective-modules"
version = "0.1.0"
defaultTargets = ["ProjectiveModules", "ProjectiveModulesTests"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "general-linear-groups"
git = "https://github.com/FormalFrontier/general-linear-groups.git"
rev = "2683f75e2c5774ddd1295c46062035cb6afabb8a"

[[require]]
name = "stable-range"
git = "https://github.com/FormalFrontier/stable-range.git"
rev = "71625754592cadb5330b3452d626dc659405da65"

[[lean_lib]]
name = "ProjectiveModules"

[[lean_lib]]
name = "ProjectiveModulesTests"
srcDir = "tests"
roots = ["PublicAPIClient", "ProjectiveModulesTests.InfiniteCoordinatesClient", "ProjectiveModulesTests.InvariantBasisNumberClient", "ProjectiveModulesTests.CyclicTraceClient", "ProjectiveModulesTests.StablePresentationClient", "ProjectiveModulesTests.StableKernelClient", "ProjectiveModulesTests.IsotypicMultiplicityClient", "ProjectiveModulesTests.MatrixRowClient", "ProjectiveModulesTests.ScalarRankClient", "ProjectiveModulesTests.FreeMatrixRankClient", "ProjectiveModulesTests.FiniteScalarExtensionClient", "ProjectiveModulesTests.FiniteFreeSummandClient", "ProjectiveModulesTests.RightFreeScalarExtensionClient", "ProjectiveModulesTests.RightFiniteProjectiveExtensionClient", "ProjectiveModulesTests.RightRegularDefectClient", "ProjectiveModulesTests.RightExtensionComparisonClient", "ProjectiveModulesTests.FiniteProjectiveSmallnessClient", "ProjectiveModulesTests.RightExtensionComparisonCoherenceClient", "ProjectiveModulesTests.IdempotentSpanClient", "ProjectiveModulesTests.RightIdempotentExtensionClient", "ProjectiveModulesTests.LocalRingClient", "ProjectiveModulesTests.IdempotentSpanSemiringClient", "ProjectiveModulesTests.RightRegularModuleClient", "ProjectiveModulesTests.FiniteModuleDimensionClient", "ProjectiveModulesTests.FiniteStabilizationClient", "ProjectiveModulesTests.FreeWordAlgebraClient", "ProjectiveModulesTests.K0Client", "ProjectiveModulesTests.K0RankClient", "ProjectiveModulesTests.K0RepresentativeClient", "ProjectiveModulesTests.K0ZeroRingClient", "ProjectiveModulesTests.K0FiniteStabilizationClient", "ProjectiveModulesTests.RightIdealRingConstructorClient", "ProjectiveModulesTests.FreeWordSuffixFamilyClient", "ProjectiveModulesTests.FreeWordAugmentationClient", "ProjectiveModulesTests.RightExtensionTensorProductClient"]
