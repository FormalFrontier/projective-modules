name = "projective-modules"
version = "0.1.0"
defaultTargets = ["ProjectiveModules", "ProjectiveModulesTests"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "general-linear-groups"
git = "https://github.com/FormalFrontier/general-linear-groups.git"
rev = "c9705889a85f85cc89d92d21372bb9bc360162c8"

[[require]]
name = "stable-range"
git = "https://github.com/FormalFrontier/stable-range.git"
rev = "c283b01ed9ebc33c7eefcdb4f3d2ca45141f469e"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "e217d21d8e1fa0d1613a7e9bfb035517b1b90d14"

[[lean_lib]]
name = "ProjectiveModules"

